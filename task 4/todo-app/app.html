<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6c4cff">
<title>My tasks | Tickit To-Do App</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23c6f432%27 stroke=%27%2317142b%27 stroke-width=%273%27/%3E%3Cpath d=%27M9 16.5l4.5 4.5L23 11%27 fill=%27none%27 stroke=%27%2317142b%27 stroke-width=%274%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <a class="brand" href="app.html">
    <span class="logo"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4L16 6" fill="none" stroke="#17142b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    Tickit
  </a>
  <div class="top-r">
    <button class="btn btn-white btn-sm" id="alerts" type="button">Get alerts</button>
    <span class="avatar" id="avatar" aria-hidden="true"></span>
    <span id="uname"></span>
    <button class="btn btn-white btn-sm" id="logout" type="button">Log out</button>
  </div>
</header>
<div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

<main class="shell">
  <aside class="side" aria-label="Your lists">
    <h2 class="side-h">Lists</h2>
    <nav class="lists" id="lists"></nav>
    <form class="list-form" id="list-form" novalidate>
      <label class="sr" for="new-list">New list name</label>
      <input id="new-list" type="text" maxlength="24" placeholder="New list" autocomplete="off">
      <button class="btn btn-lime btn-sm" type="submit">Add list</button>
    </form>
    <p class="err" id="list-err" role="alert"></p>
  </aside>

  <section class="main" aria-label="Tasks">
    <div class="head">
      <div class="head-l">
        <p class="date" id="today"></p>
        <div id="title-wrap"></div>
        <div class="head-actions" id="head-actions" hidden>
          <button class="btn btn-white btn-sm" id="rename" type="button">Rename list</button>
          <button class="btn btn-white btn-sm" id="del-list" type="button">Delete list</button>
        </div>
      </div>
      <div class="ring" role="img" id="ring-wrap">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="50"/><circle class="fg" id="ring" cx="60" cy="60" r="50"/></svg>
        <div class="ring-t" id="ring-t">0/0</div>
      </div>
    </div>

    <form class="add" id="add-form" novalidate>
      <div class="add-r1">
        <div>
          <label class="sr" for="t-title">Task name</label>
          <input id="t-title" type="text" maxlength="120" placeholder="What needs doing?" autocomplete="off">
        </div>
        <button class="btn" type="submit">Add task</button>
      </div>
      <div class="add-r2">
        <label class="fld">Date <input id="t-date" type="date"></label>
        <label class="fld">Time <input id="t-time" type="time"></label>
        <label class="fld">Priority
          <select id="t-pri"><option value="0">Low</option><option value="1" selected>Normal</option><option value="2">High</option></select></label>
        <label class="fld">List <select id="t-list"></select></label>
      </div>
      <p class="err" id="add-err" role="alert"></p>
    </form>

    <div class="bar">
      <div class="seg" role="group" aria-label="Show tasks">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="active" aria-pressed="false">Active</button>
        <button type="button" data-f="done" aria-pressed="false">Done</button>
      </div>
      <div class="grow"><label class="sr" for="search">Search tasks</label><input id="search" type="search" placeholder="Search tasks" autocomplete="off"></div>
      <label class="sr" for="sort">Sort tasks</label>
      <select id="sort">
        <option value="due">Sort: due date</option>
        <option value="pri">Sort: priority</option>
        <option value="new">Sort: newest</option>
        <option value="az">Sort: A to Z</option>
      </select>
    </div>

    <ul class="tasks" id="tasks"></ul>

    <div class="empty" id="empty" hidden>
      <span class="bbox"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4"/></svg></span>
      <h3 id="empty-h">No tasks yet</h3>
      <p id="empty-p">Type a task above and press Add task.</p>
    </div>

    <div class="foot-row">
      <span id="left"></span>
      <button class="btn btn-white btn-sm" id="clear-done" type="button" hidden>Clear completed</button>
    </div>
  </section>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
